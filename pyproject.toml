[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskrag"
version = "0.1.0"
description = "Extract, score and compare risk factors from SEC 10-K filings with switchable LLM providers"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yu Hua (Eleanor) Cheng" }]
dependencies = [
  "httpx>=0.27", "beautifulsoup4>=4.12", "lxml>=5.0", "pydantic>=2.6", "pandas>=2.0",
  "scikit-learn>=1.4", "tabulate>=0.9", "python-dotenv>=1.0",
  "openai>=3.0", "anthropic>=1.0", "google-genai>=2.0",
  "fastapi>=0.110", "uvicorn>=0.29", "streamlit>=1.40", "plotly>=5.20",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "httpx>=0.27"]

[project.scripts]
riskrag = "riskrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
